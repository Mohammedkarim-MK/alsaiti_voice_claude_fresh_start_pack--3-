# Supabase project config. `verify_jwt` gates each Edge Function:
#   * true  → the caller MUST present a valid Supabase Auth JWT (a signed-in app user).
#   * false → public entry points that authenticate a different way:
#       - crm-callback   is hit by the CRM's browser redirect (no JWT); it trusts the single-use state.
#       - telnyx-webhook is hit by Telnyx (no JWT); it verifies the Ed25519 signature itself.
project_id = "alsaiti-voice"

[functions.crm-authorise]
verify_jwt = true

[functions.crm-callback]
verify_jwt = false

[functions.crm-test]
verify_jwt = true

[functions.crm-metadata]
verify_jwt = true

[functions.crm-status]
verify_jwt = true

[functions.crm-sync-lead]
verify_jwt = true

[functions.telnyx-verify]
verify_jwt = true

[functions.telnyx-search]
verify_jwt = true

[functions.telnyx-order]
verify_jwt = true

[functions.telnyx-webhook]
verify_jwt = false

[functions.tts]
verify_jwt = false

[functions.lead-notify]
verify_jwt = true

[functions.contact-submit]
verify_jwt = false

# Public so an external uptime monitor can watch it without a credential — the check that tells
# you the lead pipeline is broken must not depend on the lead pipeline working. Anonymous callers
# get a coarse status only; detail needs a JWT.
[functions.health]
verify_jwt = false

# The outbox consumer. Public because the caller is a scheduler with no user session; it requires
# EVENTS_CONSUMER_SECRET instead and refuses to run at all if that is unset.
[functions.events-consume]
verify_jwt = false

# Stripe has no user session; the Stripe-Signature header is the proof of authenticity, and the
# function refuses to run at all without STRIPE_WEBHOOK_SECRET.
[functions.stripe-webhook]
verify_jwt = false

# Only a signed-in user may start checkout, and can_admin_as() then restricts it to a workspace
# they administer. Without that, anyone could open a Checkout Session that provisions somebody
# else's account once paid.
[functions.stripe-billing]
verify_jwt = true
